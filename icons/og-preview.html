<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 1200px; height: 630px;
  background: #0a0a0a;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  position: relative;
}
.bg-glow {
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(255,112,67,0.25) 0%, transparent 70%);
  border-radius: 50%;
  top: -100px; left: -100px;
}
.bg-glow2 {
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(255,152,0,0.12) 0%, transparent 70%);
  border-radius: 50%;
  bottom: -100px; right: 100px;
}
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-start;
  height: 100%; padding: 80px 100px;
}
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,112,67,0.1);
  border: 1px solid rgba(255,112,67,0.3);
  color: #ff7043; font-size: 18px; font-weight: 600;
  padding: 8px 20px; border-radius: 100px;
  margin-bottom: 32px; letter-spacing: 0.04em;
}
.logo {
  font-size: 100px; font-weight: 900;
  color: #fff; letter-spacing: -4px;
  line-height: 1; margin-bottom: 24px;
}
.logo span { color: #ff7043; }
.tagline {
  font-size: 28px; color: #888;
  max-width: 700px; line-height: 1.4; margin-bottom: 40px;
}
.tagline strong { color: #ff9800; }
.pills { display: flex; gap: 12px; }
.pill {
  padding: 10px 20px; border-radius: 100px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #ccc; font-size: 16px;
}
.url {
  position: absolute; bottom: 40px; right: 60px;
  color: #333; font-size: 18px; font-weight: 600;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>
<div class="content">
  <div class="badge">✦ India's First AI Prompt Engine</div>
  <div class="logo">clar<span>ix</span></div>
  <div class="tagline">
    Turn rough ideas into <strong>powerful AI prompts</strong><br>
    Hindi · Hinglish · English · 20+ Languages
  </div>
  <div class="pills">
    <div class="pill">🤖 ChatGPT</div>
    <div class="pill">🎨 Midjourney</div>
    <div class="pill">🧠 Claude</div>
    <div class="pill">♊ Gemini</div>
    <div class="pill">🆓 Free Forever</div>
  </div>
</div>
<div class="url">clarix.digital</div>
</body>
</html>
