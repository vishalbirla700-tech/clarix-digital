<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YZJ8P58KTJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YZJ8P58KTJ');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expert Breakdown &#10022; Clarix</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff7043'/><text x='50%' y='55%' font-size='18' text-anchor='middle' dominant-baseline='middle' fill='white'>&#10022;</text></svg>">
  <link rel="stylesheet" href="css/design.css?v=20260413P">
  <link rel="stylesheet" href="css/components.css?v=20260413P">
  <link rel="stylesheet" href="css/pages/breakdown.css?v=20260413P">
  <link rel="stylesheet" href="/css/auth.css?v=20260413P">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="theme-dark">

  <nav class="topnav dark" style="position:sticky;top:0;z-index:100">
    <div class="nav-left" style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-ghost btn-sm" onclick="goBack()" title="Back to Write"
        style="display:flex;align-items:center;gap:6px;font-size:13px">
        &#10094; Back
      </button>
      <div class="nav-logo" style="cursor:default">
        <span class="nav-star">&#10022;</span> clarix
      </div>
    </div>
    <div style="font-size:13px;color:#555;flex:1;text-align:center">Expert Breakdown</div>
    <div class="nav-right">
      <button class="btn btn-ghost btn-sm" onclick="copyAll()">&#128203; Copy All</button>
      <button class="btn btn-ghost btn-sm" onclick="exportTXT()">&#128228; Export</button>
      <button class="btn btn-primary btn-sm" onclick="openPlatform()">Open in AI &#10148;</button>
    </div>
  </nav>

  <div class="breakdown-page container-lg" id="breakdownPage">
    <div class="bd-empty" id="bdEmpty">&#9203; Loading breakdown...</div>
  </div>

  <script src="config.js?v=20260413P"></script>
  <script src="js/languages.js?v=20260413P"></script>
  <script src="js/core.js?v=20260413P"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var raw = localStorage.getItem('clarix_breakdown_data');
    if (!raw) {
      document.getElementById('bdEmpty').textContent = '\u26A0 No breakdown data found. Go to Write page and generate first.';
      return;
    }
    var d = JSON.parse(raw);
    render(d);
  });

  function goBack() {
    if (window.opener && !window.opener.closed) {
      window.opener.focus();
      window.close();
    } else {
      window.location.href = 'write.html';
    }
  }

  function render(d) {
    var bd = d.breakdown || {};
    var s  = bd.settings || {};
    var page = document.getElementById('breakdownPage');

    var settingsHtml = [
      ['&#127912; Style',    s.style],
      ['&#128161; Lighting', s.lighting],
      ['&#128247; Camera',   s.camera],
      ['&#10024; Quality',   s.quality]
    ].map(function(pair) {
      var k = pair[0], v = pair[1];
      return v ? '<div class="bd-setting-card"><div class="bd-setting-key">' + k + '</div><div class="bd-setting-val">' + esc(v) + '</div></div>' : '';
    }).join('');

    var variationsHtml = (d.variations || []).map(function(v, i) {
      return '<div class="bd-variation"><div class="bd-var-num">V' + (i+1) + '</div><div class="bd-var-text">' + esc(v) + '</div><button class="btn-copy-inline" onclick="copyText(\'' + escJ(v) + '\')">&#128203;</button></div>';
    }).join('');

    var defaultPlatforms = [
      {name:'ChatGPT',   match:92, reason:'Best for text generation and roleplay'},
      {name:'Claude',    match:95, reason:'Ideal for nuanced, detailed prompts'},
      {name:'Gemini',    match:88, reason:'Great for visual descriptions'},
      {name:'Midjourney',match:97, reason:'Optimised for image generation'},
      {name:'DALL-E',    match:85, reason:'Good for photo-realistic outputs'}
    ];
    var platformIcons = {
      'ChatGPT':'&#129302;','Claude':'&#129302;','Gemini':'&#11088;',
      'Midjourney':'&#127912;','DALL-E':'&#128444;','Grok':'&#9889;',
      'Perplexity':'&#128269;','DeepSeek':'&#128640;','Copilot':'&#129351;','Meta AI':'&#129302;'
    };
    var platforms = (bd.platforms || defaultPlatforms).slice().sort(function(a,b){ return b.match - a.match; });
    var platformsHtml = platforms.map(function(p, i) {
      var icon  = platformIcons[p.name] || '&#129302;';
      var color = p.match >= 90 ? '#22c55e' : p.match >= 80 ? '#ff9800' : '#ef4444';
      var topBadge = i === 0 ? '<span class="bd-top-badge">&#11088; TOP PICK</span>' : '';
      return '<div class="bd-chart-row">'
        + '<div class="bd-chart-label"><span class="bd-chart-icon">' + icon + '</span><span class="bd-chart-name">' + p.name + '</span>' + topBadge + '</div>'
        + '<div class="bd-chart-bar-wrap"><div class="bd-chart-bar-track"><div class="bd-chart-bar-fill" data-width="' + p.match + '" style="width:0%;background:' + color + '"></div></div>'
        + '<span class="bd-chart-pct" style="color:' + color + '">' + p.match + '%</span></div>'
        + '<div class="bd-chart-reason">' + (p.reason || '') + '</div>'
        + '</div>';
    }).join('');

    var socialHtml = d.socialCaption ? (
      '<div class="bd-section">'
      + '<div class="bd-section-header">'
      + '<div class="bd-section-label">&#128227; Social Caption</div>'
      + '<div style="display:flex;gap:8px">'
      + '<button class="btn-copy-inline" onclick="copyText(\'' + escJ(d.socialCaption) + '\')">&#128203; Copy</button>'
      + '<button class="btn btn-primary btn-sm" onclick="openPlatform()">Open in AI &#10148;</button>'
      + '</div></div>'
      + '<div class="bd-block">' + esc(d.socialCaption) + '</div>'
      + '</div>'
    ) : '';

    page.innerHTML =
      '<!-- HEADER -->'
      + '<div class="bd-header"><div class="bd-header-left">'
      + '<div class="ai-badge"><span class="badge-star">&#10022;</span> Expert Breakdown</div>'
      + '<h1 class="display-md" style="margin-top:10px">Full Analysis</h1>'
      + '<div class="bd-meta-row">'
      + '<span class="bd-meta">' + (d.langFlag || '&#127988;') + ' ' + (d.lang || 'English') + '</span>'
      + (d.platform ? '<span class="bd-meta">&#10148; ' + d.platform + '</span>' : '')
      + '<span class="bd-meta">Model: ' + (d.model || 'Groq') + '</span>'
      + '<span class="bd-meta score">&#11088; Score: ' + (d.score || 0) + '/100</span>'
      + '</div></div></div>'

      + '<!-- ORIGINAL INPUT -->'
      + '<div class="bd-section"><div class="bd-section-label">&#128196; Original Input</div>'
      + '<div class="bd-block muted">' + esc(d.text) + '</div></div>'

      + '<!-- ENHANCED PROMPT -->'
      + '<div class="bd-section"><div class="bd-section-header">'
      + '<div class="bd-section-label">&#9889; Enhanced Prompt</div>'
      + '<button class="btn-copy-inline" onclick="copyText(\'' + escJ(d.enhanced) + '\')">&#128203; Copy</button>'
      + '</div><div class="bd-block highlight">' + esc(d.enhanced) + '</div></div>'

      + '<!-- TECHNICAL SETTINGS -->'
      + '<div class="bd-section"><div class="bd-section-label">&#128247; Technical Settings</div>'
      + '<div class="bd-settings-grid">' + settingsHtml + '</div></div>'

      + '<!-- 3 VARIATIONS -->'
      + '<div class="bd-section"><div class="bd-section-label">&#127381; 3 Variations</div>'
      + variationsHtml + '</div>'

      + '<!-- PRO UPGRADE PROMPT -->'
      + '<div class="bd-section"><div class="bd-section-header">'
      + '<div class="bd-section-label">&#9889; Pro Upgrade Prompt</div>'
      + '<div style="display:flex;gap:8px">'
      + '<button class="btn-copy-inline" onclick="copyText(\'' + escJ(bd.proPrompt || d.enhanced) + '\')">&#128203; Copy</button>'
      + '<button class="btn btn-primary btn-sm" onclick="openPlatform()">Open in ' + (d.platform || 'AI') + ' &#10148;</button>'
      + '</div></div>'
      + '<div class="bd-block pro-block">' + esc(bd.proPrompt || '[ADVANCED] ' + d.enhanced + ', hyperdetailed, award-winning, trending on ArtStation') + '</div></div>'

      + '<!-- PLATFORM FIT SCORES -->'
      + '<div class="bd-section"><div class="bd-section-label">&#128270; Platform Fit Scores</div>'
      + '<div class="bd-platform-chart">' + platformsHtml + '</div></div>'

      + socialHtml

      + '<!-- EXPORT FOOTER -->'
      + '<div class="bd-footer">'
      + '<button class="btn btn-ghost btn-sm" onclick="copyAll()">&#128203; Copy All</button>'
      + '<button class="btn btn-ghost btn-sm" onclick="exportTXT()">&#128228; Export TXT</button>'
      + '<button class="btn btn-primary btn-sm" onclick="openPlatform()">Open in ' + (d.platform || 'AI') + ' &#10148;</button>'
      + '</div>';

    /* Animate chart bars */
    setTimeout(function() {
      document.querySelectorAll('.bd-chart-bar-fill[data-width]').forEach(function(el) {
        el.style.transition = 'width 0.9s cubic-bezier(0.4,0,0.2,1)';
        el.style.width = el.getAttribute('data-width') + '%';
      });
    }, 120);
  }

  function esc(s)  { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function escJ(s) { return (s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ').slice(0, 500); }

  function copyAll() {
    var d = JSON.parse(localStorage.getItem('clarix_breakdown_data') || '{}');
    var lines = [
      'CLARIX EXPERT BREAKDOWN',
      '='.repeat(50),
      'Original:\n' + (d.text || ''),
      'Enhanced:\n' + (d.enhanced || ''),
      (d.variations && d.variations.length) ? 'Variations:\n' + d.variations.map(function(v,i){ return (i+1) + '. ' + v; }).join('\n') : '',
      'Social Caption:\n' + (d.socialCaption || ''),
      '='.repeat(50),
      'Generated by Clarix'
    ].filter(Boolean).join('\n\n');
    copyText(lines);
  }

  function exportTXT() {
    var d = JSON.parse(localStorage.getItem('clarix_breakdown_data') || '{}');
    var content = 'CLARIX EXPERT BREAKDOWN\n' + '='.repeat(50) + '\n\n'
      + 'Original:\n' + (d.text || '') + '\n\n'
      + 'Enhanced:\n' + (d.enhanced || '') + '\n\n'
      + 'Variations:\n' + (d.variations || []).map(function(v,i){ return (i+1) + '. ' + v; }).join('\n') + '\n\n'
      + 'Social Caption:\n' + (d.socialCaption || '') + '\n\n'
      + '='.repeat(50) + '\nGenerated by Clarix';
    downloadFile('clarix-breakdown.txt', content);
    Toast.show('Exported!', 'success');
  }

  function openPlatform() {
    var d = JSON.parse(localStorage.getItem('clarix_breakdown_data') || '{}');
    var platforms = [
      {name:'ChatGPT',    url:'https://chat.openai.com'},
      {name:'Claude',     url:'https://claude.ai'},
      {name:'Gemini',     url:'https://gemini.google.com'},
      {name:'Midjourney', url:'https://midjourney.com'},
      {name:'Grok',       url:'https://grok.x.ai'}
    ];
    var p = platforms.find(function(pl){ return pl.name === d.platform; });
    var pro = (d.breakdown && d.breakdown.proPrompt) ? d.breakdown.proPrompt : (d.enhanced || '');
    copyText(pro, null);
    setTimeout(function(){ window.open(p ? p.url : 'https://chat.openai.com', '_blank'); }, 400);
    Toast.show('Pro prompt copied! Opening ' + (d.platform || 'AI') + '...', 'success');
  }
  </script>

  <!-- Clarix Firebase Auth -->
  <script src="/js/firebase-auth.js?v=20260413P"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof ClarixAuth !== 'undefined') ClarixAuth.init();
    });
  </script>
  <script src="js/pwa.js?v=20260413P"></script>
</body>
</html>
