<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Clarix AI</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7043">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff7043'/><text x='50%' y='55%' font-size='18' text-anchor='middle' dominant-baseline='middle' fill='white'>&#10022;</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design.css?v=20260413P">
  <link rel="stylesheet" href="css/components.css?v=20260413P">
  <link rel="stylesheet" href="css/sidebar.css?v=20260413P">
  <link rel="stylesheet" href="css/auth.css?v=20260413P">
  <style>
    .profile-wrap { max-width: 600px; margin: 60px auto; padding: 0 20px 100px; }
    .profile-card {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 32px 28px; text-align: center;
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #ff7043, #ff9800);
      font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 900;
      color: #fff; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .profile-name { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 900; margin: 0 0 4px; }
    .profile-email { font-size: 13px; color: rgba(255,255,255,.5); margin: 0 0 24px; }
    .profile-stat-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
    .profile-stat {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
      border-radius: 12px; padding: 14px 20px; min-width: 100px;
    }
    .profile-stat-val { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 900; color: #ff7043; }
    .profile-stat-lbl { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .profile-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="theme-dark">

  <!-- TOP NAV -->
  <nav class="topnav dark">
    <div class="nav-left">
      <button class="sidebar-toggle-btn" onclick="Sidebar.toggle()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-logo" onclick="location.href='index.html'"><span class="nav-star">&#10022;</span> clarix</div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="write.html" class="nav-link">Write</a>
      <a href="inspire.html" class="nav-link">Inspire</a>
      <a href="library.html" class="nav-link">Library</a>
      <a href="apps.html" class="nav-link">Apps</a>
    </div>
    <div class="nav-right">
      <a href="write.html" class="btn btn-primary btn-sm">Try Free &#10022;</a>
    </div>
  </nav>

  <div class="profile-wrap">
    <div class="profile-card" id="profileCard">
      <div class="profile-avatar" id="profileAvatar">C</div>
      <div class="profile-name" id="profileName">Clarix User</div>
      <div class="profile-email" id="profileEmail">&mdash;</div>
      <div class="profile-stat-row">
        <div class="profile-stat">
          <div class="profile-stat-val" id="statPrompts">&mdash;</div>
          <div class="profile-stat-lbl">Prompts Used</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val" id="statRemaining">&mdash;</div>
          <div class="profile-stat-lbl">Remaining</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val" id="statPlan">Free</div>
          <div class="profile-stat-lbl">Plan</div>
        </div>
      </div>
      <div class="profile-actions">
        <a href="write.html" class="btn btn-primary">&#9997;&#65039; Write Prompts</a>
        <a href="history.html" class="btn btn-secondary">&#128218; History</a>
        <button class="btn btn-ghost" onclick="if(typeof ClarixAuth!=='undefined')ClarixAuth.signOut()">&#128682; Logout</button>
      </div>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-nav">
    <div class="mnav-items">
      <a href="index.html" class="mnav-item"><span class="mnav-icon">&#127968;</span>Home</a>
      <a href="write.html" class="mnav-item"><span class="mnav-icon">&#9997;&#65039;</span>Write</a>
      <a href="inspire.html" class="mnav-item"><span class="mnav-icon">&#128276;</span>Inspire</a>
      <a href="history.html" class="mnav-item"><span class="mnav-icon">&#128218;</span>History</a>
      <a href="apps.html" class="mnav-item"><span class="mnav-icon">&#10024;</span>Apps</a>
    </div>
  </nav>

  <script src="config.js?v=20260413P"></script>
  <script src="js/languages.js?v=20260413P"></script>
  <script src="js/core.js?v=20260413P"></script>
  <script src="js/sidebar.js?v=20260413P"></script>
  <script src="js/firebase.js?v=20260413P"></script>
  <script src="js/firebase-auth.js?v=20260413P"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Sidebar) Sidebar.init();
      // Populate profile once auth resolves
      if (typeof ClarixAuth !== 'undefined') {
        ClarixAuth.onReady(function(user) {
          const p = ClarixAuth.userProfile || {};
          document.getElementById('profileAvatar').textContent = (p.name || 'C').charAt(0).toUpperCase();
          document.getElementById('profileName').textContent = p.name || user.displayName || 'Clarix User';
          document.getElementById('profileEmail').textContent = p.email || user.email || '';
          document.getElementById('statPrompts').textContent = p.trialUsed || 0;
          document.getElementById('statRemaining').textContent = ClarixAuth.remainingToday();
          document.getElementById('statPlan').innerHTML = p.isPro ? '&#10003; Pro' : 'Free';
        });
      }
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
  <script src="js/pwa.js?v=20260413P"></script>
</body>
</html>
